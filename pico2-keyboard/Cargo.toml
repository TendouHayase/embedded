[workspace]
resolver = "3"
members = ["firmware/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
embassy-rp = {version = "0.10.0", features = ["defmt", "rp235xa", "critical-section-impl", "time-driver", "binary-info"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = {version = "0.5"}
embassy-usb      = { version = "0.6", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"

defmt = "1.1.1"
defmt-rtt = "1.3.0"

static_cell = "2.1.1"


[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
debug = false
codegen-units = 1
incremental = false